[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "school-program-intelligence"
version = "0.4.0"
description = "School program intelligence — A/B/C inputs, engine simulation, preference rating"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "School Program Intelligence contributors" }]
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "networkx>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
spi = "school_program_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
